<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameJob C++ Career Radar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b11;color:#eef3f8;font-family:Inter,system-ui,sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;position:fixed;inset:0 auto 0 0;background:#0d121b;border-right:1px solid #263246;padding:25px 16px}.brand{font-weight:900;font-size:19px}.brand i{color:#8b6cff;font-style:normal}.muted{color:#8290a5;font-size:12px;line-height:1.6}.navh{margin:25px 8px 7px;color:#68768a;font-size:10px;font-weight:800;letter-spacing:.12em}.nav{width:100%;border:0;background:transparent;color:#9ba8ba;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.nav:hover,.nav.on{background:#1a2130;color:white}.note{margin-top:25px;background:#111824;border:1px solid #263246;border-radius:12px;padding:13px;font-size:11px;line-height:1.7;color:#9aa7b9}.main{margin-left:245px;width:calc(100% - 245px);padding:30px;max-width:1550px}.top{display:flex;justify-content:space-between}.top h1{margin:0;font-size:30px;letter-spacing:-1px}.updated{background:#111824;border:1px solid #263246;padding:8px 11px;border-radius:8px;font-size:11px;color:#8f9bae}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 16px}.stat,.filters,.job{background:#111824;border:1px solid #263246;border-radius:14px}.stat{padding:16px}.stat .n{font-size:25px;font-weight:850}.stat .l{font-size:11px;color:#8290a5;margin-top:4px}.purple{color:#8b6cff}.green{color:#31d0ad}.orange{color:#ffb454}.filters{padding:17px}.fh{display:flex;justify-content:space-between;margin-bottom:13px;font-size:13px;font-weight:700}.reset,.crawl{border:0;background:none;color:#9d8cff;cursor:pointer}.crawl{background:#8b6cff;color:#fff;padding:8px 10px;border-radius:8px;margin-left:10px}.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{display:block;color:#78869a;font-size:10px;margin-bottom:5px}select,input{width:100%;padding:9px;border-radius:8px;border:1px solid #29364a;background:#0b1018;color:#eef3f8;outline:0}.toolbar{display:flex;justify-content:space-between;margin:18px 0 10px;font-size:13px}.sort{width:180px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.job{padding:17px;cursor:pointer}.job:hover{border-color:#4c5a70}.jt{display:flex;justify-content:space-between;gap:10px}.co{font-size:11px;color:#8997aa}.title{font-size:16px;font-weight:750;margin-top:4px}.fit{font-size:10px;font-weight:800;padding:5px 7px;border-radius:6px;height:max-content}.high{background:#123c36;color:#53e0c1}.mid{background:#3c3017;color:#ffc767}.low{background:#2b2029;color:#ff9bb4}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:13px 0}.tag{font-size:10px;padding:4px 7px;background:#192230;border:1px solid #29374a;border-radius:6px;color:#b9c4d4}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;border-top:1px solid #222d3d;padding-top:12px;color:#8b98aa;font-size:11px}.meta b{color:#dce4ee}.jd{color:#9aa7b8;font-size:11px;line-height:1.6}.empty{grid-column:1/-1;text-align:center;padding:50px;border:1px dashed #344156;border-radius:14px;color:#8290a5}.modal{display:none;position:fixed;inset:0;background:#000b;backdrop-filter:blur(5px);padding:5vh 20px;overflow:auto;z-index:5}.mb{max-width:820px;margin:auto;background:#101722;border:1px solid #3a465a;border-radius:16px;padding:25px}.close{float:right;background:#192231;color:#fff;border:1px solid #354257;border-radius:8px;padding:7px 10px;cursor:pointer}.mb h2{margin:3px 0 5px}.sec{border-top:1px solid #273345;padding:15px 0}.sec h3{font-size:10px;color:#8795a8;letter-spacing:.08em;margin:0 0 7px}.sec p{font-size:13px;line-height:1.7;margin:0;color:#d0d8e3}.open{display:inline-block;background:#8b6cff;color:#fff;padding:10px 13px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700}@media(max-width:1000px){.side{width:200px}.main{margin-left:200px;width:calc(100% - 200px)}.fg{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{display:none}.main{margin:0;padding:18px 12px;width:100%}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.top{display:block}}
</style></head><body><div class="app"><aside class="side"><div class="brand">GAMEJOB <i>RADAR</i></div><p class="muted">C++ 게임 개발자를 위한<br>신입 · 주니어 채용 탐색기</p><div class="navh">ROLE</div><button class="nav on" data-k="role" data-v="">전체 공고</button><button class="nav" data-k="role" data-v="클라이언트 프로그래머">클라이언트</button><button class="nav" data-k="role" data-v="서버 프로그래머">서버</button><button class="nav" data-k="role" data-v="엔진 프로그래머">엔진</button><button class="nav" data-k="role" data-v="TA (테크니컬 아티스트)">TA</button><div class="navh">ENGINE</div><button class="nav" data-k="engine" data-v="Unreal Engine 5">UE5</button><button class="nav" data-k="engine" data-v="Unreal Engine">Unreal</button><button class="nav" data-k="engine" data-v="Godot">Godot</button><button class="nav" data-k="engine" data-v="Unity">Unity</button><div class="note"><b>우선순위</b><br>Unreal / 자체 엔진 / Godot<br>→ Unity 후순위<br><br>신입~3년 중심</div></aside><main class="main"><div class="top"><div><h1>C++ Career Radar</h1><p class="muted">GameJob 실시간 수집 데이터 기반 · Client / Server / Engine</p></div><div class="updated" id="updated">데이터 로딩중...</div></div><div class="stats"><div class="stat"><div class="n purple" id="total">0</div><div class="l">수집 공고</div></div><div class="stat"><div class="n green" id="new">0</div><div class="l">신입/경력무관</div></div><div class="stat"><div class="n orange" id="ue">0</div><div class="l">Unreal 계열</div></div><div class="stat"><div class="n" id="visible">0</div><div class="l">현재 필터 결과</div></div></div><div class="filters"><div class="fh"><span>FILTERS</span><span><button class="reset" id="reset">초기화</button><button class="crawl" id="crawl">↻ 지금 크롤링</button></span></div><div class="fg"><div><label>직무</label><select id="role"><option value="">전체</option><option>클라이언트 프로그래머</option><option>서버 프로그래머</option><option>엔진 프로그래머</option><option>TA (테크니컬 아티스트)</option><option>3D 배경/캐릭터/애니메이션</option></select></div><div><label>엔진</label><select id="engine"><option value="">전체</option><option>Unreal Engine 5</option><option>Unreal Engine</option><option>Godot</option><option>Unity</option><option>자체 엔진</option><option>미기재</option></select></div><div><label>회사 규모</label><select id="size"><option value="">전체</option><option>대기업</option><option>대기업 계열/자회사</option><option>중견</option><option>중소</option><option>벤처</option></select></div><div><label>경력</label><select id="career"><option value="">전체</option><option value="new">신입/경력무관</option><option value="1_3">1~3년</option><option value="junior">신입~3년</option><option value="3plus">3년+</option></select></div><div><label>처우</label><select id="employment"><option value="">전체</option><option>정규직</option><option>인턴</option><option>계약직</option></select></div><div><label>연봉</label><select id="salary"><option value="">전체</option><option value="lt3000">3000미만</option><option value="3000_4000">3000~4000</option><option value="4000_5000">4000~5000</option><option value="5000plus">5000+</option><option value="unknown">미공개</option></select></div><div><label>지역</label><select id="region"><option value="">전체</option><option>서울</option><option>경기</option><option>인천</option><option>대구</option><option>부산</option></select></div><div><label>거리 기준 지역</label><select id="near"><option value="">기준 없음</option><option>서울</option><option>경기</option><option>인천</option><option>대구</option><option>부산</option></select></div><div><label>검색</label><input id="q" placeholder="회사 · 기술 · JD 검색"></div></div></div><div class="toolbar"><span><b id="count">0</b>개 공고</span><select class="sort" id="sort"><option value="fit">적합 조건순</option><option value="newest">최근 수집순</option><option value="salary">연봉순</option><option value="near">지역 기준 우선</option></select></div><section class="cards" id="cards"></section></main></div><div class="modal" id="modal"><div class="mb"><button class="close" id="close">닫기</button><div id="content"></div></div></div>
<script>
let jobs=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const careerRank=j=>{if(/신입|무관/.test(j.career))return 0;const m=String(j.career).match(/(\d+)/);return m?Number(m[1]):99};
const salaryMax=j=>Number(j.salary?.max)||0;
async function load(){
  const r=await fetch('data/jobs.json'); const d=await r.json(); 
  const pType = new URLSearchParams(window.location.search).get('type') || 'for-dev';
  jobs = (d.jobs||[]).filter(j => j.type && j.type.includes(pType));
  
  if (pType === 'for-ta') {
    document.title = "GameJob TA & Art Radar";
    document.querySelector('.muted').innerHTML = "TA 및 3D Art 직무를 위한<br>신입 · 주니어 채용 탐색기";
    document.querySelector('.top h1').textContent = "TA & Art Career Radar";
    document.querySelector('.top p.muted').textContent = "GameJob 실시간 수집 데이터 기반 · TA / 3D Art / Technical";
  }

  $('updated').textContent=d.updatedAt?new Date(d.updatedAt).toLocaleString('ko-KR'):'데이터 없음';
  $('total').textContent=jobs.length;
  $('new').textContent=jobs.filter(j=>/신입|무관/.test(j.career)).length;
  $('ue').textContent=jobs.filter(j=>/Unreal/.test(j.engine)).length;
  render();
}
function salaryMatch(j,v){
  if(!v)return true;
  const max=salaryMax(j), min=Number(j.salary?.min)||0;
  if(v==='unknown')return !max;
  if(!max)return false;
  if(v==='lt3000')return min<3000;
  if(v==='3000_4000')return max>=3000 && min<=4000;
  if(v==='4000_5000')return max>=4000 && min<=5000;
  if(v==='5000plus')return max>=5000;
  return true;
}
function match(j){
  const v={role:$('role').value,engine:$('engine').value,size:$('size').value,career:$('career').value,emp:$('employment').value,sal:$('salary').value,region:$('region').value,q:$('q').value.toLowerCase()};
  if(v.role&&j.role!==v.role)return false;
  if(v.engine&&j.engine!==v.engine)return false;
  if(v.size&&j.companySize!==v.size)return false;
  if(v.career){if(v.career==='junior'&&!((/신입|무관/.test(j.career))||careerRank(j)<=3))return false;if(v.career==='new'&&!/신입|무관/.test(j.career))return false;if(v.career==='1_3'&&!/^[1-3]년/.test(j.career))return false;if(v.career==='3plus'&&!(/3년\+/.test(j.career)||careerRank(j)>=3))return false;}
  if(v.emp&&j.employment!==v.emp)return false;
  if(!salaryMatch(j,v.sal))return false;
  if(v.region&&!String(j.region).includes(v.region))return false;
  if(v.q&&!JSON.stringify(j).toLowerCase().includes(v.q))return false;
  return true;
}
function render(){
  let a=jobs.filter(match),s=$('sort').value,near=$('near').value;
  if(s==='fit')a.sort((x,y)=>careerRank(x)-careerRank(y));
  if(s==='newest')a.sort((x,y)=>String(y.fetchedAt).localeCompare(String(x.fetchedAt)));
  if(s==='salary')a.sort((x,y)=>salaryMax(y)-salaryMax(x));
  if(s==='near'&&near)a.sort((x,y)=>{const ax=String(x.region).includes(near)?0:1, ay=String(y.region).includes(near)?0:1;return ax-ay||careerRank(x)-careerRank(y)});
  $('count').textContent=a.length;$('visible').textContent=a.length;
  $('cards').innerHTML=a.length?a.map(j=>`<article class="job" data-id="${esc(j.id)}"><div class="jt"><div><div class="co">${esc(j.company||'회사명 미기재')}</div><div class="title">${esc(j.title||'공고명 미기재')}</div></div><span class="fit ${/신입|무관/.test(j.career)?'high':'mid'}">${/신입|무관/.test(j.career)?'신입 가능':'주니어 검토'}</span></div><div class="tags">${[j.role,j.engine,j.career,j.salary?.raw].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="meta"><div>직무 <b>${esc(j.role)}</b></div><div>엔진 <b>${esc(j.engine)}</b></div><div>경력 <b>${esc(j.career)}</b></div><div>연봉 <b>${esc(j.salary?.raw||'미공개')}</b></div><div>처우 <b>${esc(j.employment)}</b></div><div>지역 <b>${esc(j.region||'미기재')}</b></div></div><p class="jd">${esc(j.jd||'JD 상세 내용 미수집')}</p></article>`).join(''):'<div class="empty">조건에 맞는 공고가 없습니다.</div>';
  document.querySelectorAll('.job').forEach(x=>x.onclick=()=>openJob(x.dataset.id));
}
function openJob(id){
  const j=jobs.find(x=>String(x.id)===String(id));if(!j)return;
  $('content').innerHTML=`<div class="co">${esc(j.company||'')}</div><h2>${esc(j.title)}</h2><div class="muted">${esc(j.role)} · ${esc(j.engine)} · ${esc(j.region||'지역 미기재')}</div><div class="sec"><h3>JD</h3><p>${esc(j.jd||'미수집')}</p></div><div class="sec"><h3>전형</h3><p>${esc(j.process||'미수집')}</p></div><div class="sec"><h3>지원 기간</h3><p>${esc(j.period||'미수집')}</p></div><div class="sec"><h3>처우 / 연봉</h3><p>${esc(j.employment)} · ${esc(j.salary?.raw||'미공개')}</p></div><div class="sec"><h3>기업 / 경력</h3><p>${esc(j.companySize)} · ${esc(j.career)}</p></div><a class="open" href="${esc(j.url)}" target="_blank" rel="noopener">GameJob 원문 ↗</a>`;
  $('modal').style.display='block';
}
document.querySelectorAll('select,input').forEach(x=>x.oninput=render);
$('reset').onclick=()=>{document.querySelectorAll('select').forEach(x=>x.value='');$('q').value='';render()};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{$(b.dataset.k).value=b.dataset.v;render();document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
$('close').onclick=()=>$('modal').style.display='none';$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').style.display='none'};
$('crawl').onclick=()=>{ window.open('https://github.com/login', '_blank'); };
$('crawl').textContent = '자동 크롤링(GitHub)';
load();
</script></body></html>
